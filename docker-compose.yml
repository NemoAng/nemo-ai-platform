services:
  backend:
    build: ./backend
    container_name: nemo-ai-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - chromadb

  postgres:
    image: postgres:16
    container_name: nemo-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nemo_ai
      POSTGRES_USER: nemo_ai
      POSTGRES_PASSWORD: nemo_ai_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  chromadb:
    image: chromadb/chroma:latest
    container_name: nemo-ai-chromadb
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "127.0.0.1:8011:8000"

volumes:
  postgres_data:
  chroma_data:
